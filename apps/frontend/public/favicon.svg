  <rect x="6" y="1" width="4" height="4" fill="#ffd23f"/>
  <rect x="11" y="1" width="4" height="4" fill="#1fae5b"/>
  <rect x="1" y="6" width="4" height="4" fill="#4f86f0"/>
  <rect x="6" y="6" width="4" height="4" fill="#ffd23f"/>
  <rect x="11" y="6" width="4" height="4" fill="#ef5a3c"/>
