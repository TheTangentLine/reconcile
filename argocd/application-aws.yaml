# Argo CD Application for the AWS (EKS) cluster created by infra/.
#
# Same chart as argocd/application.yaml, plus values-aws.yaml:
# DocumentDB instead of in-cluster MongoDB, and a public load balancer.
# Terraform creates the reconcile namespace and the database Secret, so the
# only manual step is:
#   kubectl apply -f argocd/application-aws.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reconcile
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/TheTangentLine/reconcile.git
    targetRevision: main
    path: charts/reconcile
    helm:
      releaseName: reconcile
      valueFiles:
        - values.yaml
        - values-aws.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: reconcile

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
