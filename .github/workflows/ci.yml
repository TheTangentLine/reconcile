name: CI

on:
  push:
    branches: [main]
    # GitOps commits (image tag bumps in charts/) and docs shouldn't rebuild images.
    paths-ignore: ['charts/**', 'argocd/**', 'infra/**', 'docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['charts/**', 'argocd/**', 'infra/**', 'docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend · test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backend
    env:
      # mongodb-memory-server downloads mongod here; cached between runs.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('apps/backend/package-lock.json') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend · test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Image · ${{ matrix.service }}
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      # Pull requests only check that the image builds; pushes publish it.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag = full commit SHA only (no `latest`), so every image is immutable
      # and a GitOps repo can pin an exact build.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          flavor: latest=false
          tags: type=sha,format=long,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitOps: point the Helm chart at the images just pushed. The commit is made
  # with GITHUB_TOKEN, which never triggers another workflow run (no loop).
  update-chart:
    name: Update chart image tags
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One bump at a time; queued runs wait instead of being cancelled.
    concurrency:
      group: update-chart
      cancel-in-progress: false
    env:
      TAG: ${{ github.sha }}
      VALUES: charts/reconcile/values.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # needed to compare commits below

      - name: Set image tags in values.yaml
        id: bump
        run: |
          current=$(yq '.backend.image.tag' "$VALUES")
          # A slower, older run must not roll the chart back past a newer commit.
          if [ -n "$current" ] && git cat-file -e "${current}^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "$TAG" "$current"; then
            echo "values.yaml is already at $current, which includes $TAG. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Edit only the two tag lines (yq locates them) so comments and
          # formatting in values.yaml stay untouched.
          for svc in backend frontend; do
            line=$(yq ".${svc}.image.tag | line" "$VALUES")
            sed -i "${line}s/tag: .*/tag: \"${TAG}\"/" "$VALUES"
          done
          test "$(yq '.backend.image.tag' "$VALUES")" = "$TAG"
          test "$(yq '.frontend.image.tag' "$VALUES")" = "$TAG"
          git diff
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject=$(git log -1 --format=%s "$TAG")
          git commit -am "chore(chart): deploy ${TAG:0:7}" -m "Set backend and frontend image tags to ${TAG}" -m "Built from: ${subject}"
          # Someone may have pushed meanwhile; rebase and retry.
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
