name: Vercel frontend

# Vercel builds and deploys this app itself (Git integration). This workflow
# only runs the checks, so a broken change shows up red on the commit / PR.
on:
  pull_request:
    paths: ['apps/vercel-frontend/**', '.github/workflows/vercel-frontend.yml']
  push:
    branches: [main]
    paths: ['apps/vercel-frontend/**', '.github/workflows/vercel-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/vercel-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vercel-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
