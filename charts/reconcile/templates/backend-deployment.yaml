{{- $c := dict "ctx" $ "component" "backend" }}
{{- $v := .Values.backend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reconcile.fullname" . }}-backend
  labels:
    {{- include "reconcile.labels" $c | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "reconcile.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reconcile.labels" $c | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes (and zones, when the cluster has them).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "reconcile.selectorLabels" $c | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "reconcile.selectorLabels" $c | nindent 14 }}
      containers:
        - name: backend
          image: {{ include "reconcile.image" (dict "component" "backend" "image" $v.image) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: SEED_ON_START
              value: {{ $v.seedOnStart | quote }}
            {{- with $v.corsOrigin }}
            - name: CORS_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.mongodb.enabled }}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "reconcile.mongodb.secretName" . }}
                  key: mongodb-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "reconcile.mongodb.secretName" . }}
                  key: mongodb-root-password
            # $(VAR) is expanded by Kubernetes from the two variables above.
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@{{ include "reconcile.mongodb.fullname" . }}:27017/{{ .Values.mongodb.database }}?authSource=admin"
            {{- else }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-backend" (include "reconcile.fullname" .)) $v.externalMongodb.existingSecret }}
                  key: MONGODB_URI
            {{- end }}
          # Only listens once connected to MongoDB, so give it time to start.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
            failureThreshold: 40
          # Not ready (removed from the Service) while the database is unreachable...
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # ...but only restarted if the process itself stops answering.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
