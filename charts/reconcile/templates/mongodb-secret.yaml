{{- if and .Values.mongodb.enabled (not .Values.mongodb.auth.existingSecret) }}
{{- $name := include "reconcile.mongodb.fullname" . }}
{{- $password := .Values.mongodb.auth.rootPassword }}
{{- if not $password }}
{{- /* Reuse the generated password on upgrades. `lookup` needs cluster access,
       so with `helm template`-based tools (e.g. Argo CD) set rootPassword or
       existingSecret instead, or the password changes on every render. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "mongodb-root-password") }}
{{- $password = index $existing.data "mongodb-root-password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "reconcile.labels" (dict "ctx" $ "component" "mongodb") | nindent 4 }}
  annotations:
    # Never delete the credentials the data volume was initialised with.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  mongodb-root-username: {{ .Values.mongodb.auth.rootUsername | quote }}
  mongodb-root-password: {{ $password | quote }}
{{- end }}
