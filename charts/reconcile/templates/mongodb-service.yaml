{{- if .Values.mongodb.enabled }}
{{- $c := dict "ctx" $ "component" "mongodb" }}
# Headless: gives the StatefulSet pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "reconcile.mongodb.fullname" . }}
  labels:
    {{- include "reconcile.labels" $c | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "reconcile.selectorLabels" $c | nindent 4 }}
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
{{- end }}
