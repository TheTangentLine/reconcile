{{- /* Only for an external database given as a plain URI. */}}
{{- if and (not .Values.mongodb.enabled) (not .Values.backend.externalMongodb.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reconcile.fullname" . }}-backend
  labels:
    {{- include "reconcile.labels" (dict "ctx" $ "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  MONGODB_URI: {{ required "backend.externalMongodb.uri or .existingSecret is required when mongodb.enabled=false" .Values.backend.externalMongodb.uri | quote }}
{{- end }}
